[package]
name = "subtitle-searcher"
version = "0.1.0"
description = "Local intelligent subtitle search for shows and movies"
authors = ["oyayasu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
once_cell = "1"
