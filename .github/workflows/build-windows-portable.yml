name: Build Windows Portable EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle

      - name: Prepare portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "src-tauri\target\release\subtitle-searcher.exe" "artifact\Subtitle Searcher.exe"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Searcher-Windows-Portable
          path: artifact/Subtitle Searcher.exe
          if-no-files-found: error
