name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate branded Windows icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_icon.py

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run tauri build -- --no-bundle

      - name: Prepare portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri\target\release\subtitle-searcher.exe" "portable\Subtitle-Searcher.exe"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Searcher-Windows
          path: portable/Subtitle-Searcher.exe
          if-no-files-found: error

      - name: Publish executable to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "portable\Subtitle-Searcher.exe" --clobber
          } else {
            gh release create $tag "portable\Subtitle-Searcher.exe" --target "${{ github.sha }}" --title "Subtitle Searcher - Windows" --notes "Portable Windows executable built automatically by GitHub Actions."
          }