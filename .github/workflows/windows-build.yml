name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run tauri build -- --no-bundle

      - name: Prepare portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable\Shows | Out-Null
          Copy-Item src-tauri\target\release\subtitle-searcher.exe portable\Subtitle-Searcher.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Searcher-Windows
          path: portable/
          if-no-files-found: error
